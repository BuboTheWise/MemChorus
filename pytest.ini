[pytest]
norecursedirs = .git __pycache__ .pytest_cache src docs
testpaths = tests

# Disable pytest-profiling plugin globally (causes --profile argparse conflict)
# Run tests in parallel across 4 workers for CI/local speed (1249 tests ~24s with -n4)
addopts = -p no:profiling --timeout=30 -n 4

# Default timeout prevents any single test from hanging indefinitely
timeout = 30

# Coroutine lifecycle warnings in exception-path mocks are expected
filterwarnings =
    ignore:coroutine 'wait_for' was never awaited:RuntimeWarning
    ignore:coroutine '_call_tool_async' was never awaited:RuntimeWarning
    ignore:coroutine '_McpClient\.connect\<locals\>._do_init' was never awaited:RuntimeWarning
