[pytest]
norecursedirs = .git __pycache__ .pytest_cache src docs
testpaths = tests

# Coroutine lifecycle warnings in exception-path mocks are expected - when _run_async
# is mocked with side_effect, the wait_for and inner coros become unreachable.
filterwarnings =
    ignore:coroutine 'wait_for' was never awaited:RuntimeWarning
    ignore:coroutine '_call_tool_async' was never awaited:RuntimeWarning
    ignore:coroutine '_McpClient\.connect\.<locals>\._do_init' was never awaited:RuntimeWarning
